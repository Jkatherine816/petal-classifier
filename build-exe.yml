name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib opencv-python Pillow scikit-learn pandas
          pip install PySide6-Essentials pyinstaller pytest

      - name: Run regression tests
        run: |
          set QT_QPA_PLATFORM=offscreen
          pytest tests/ -q

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed ^
            --name "SDP_PetalClassifier" ^
            --collect-all torch ^
            --collect-all torchvision ^
            main.py

      - name: Smoke check output
        run: |
          if (-Not (Test-Path "dist\SDP_PetalClassifier\SDP_PetalClassifier.exe")) {
            Write-Error "EXE not found after build"
            exit 1
          }
          Get-ChildItem "dist\SDP_PetalClassifier" | Select-Object -First 5
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDP-PetalClassifier-windows
          path: dist/SDP_PetalClassifier/
          retention-days: 7
